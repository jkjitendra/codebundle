name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux package dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e exporter-python pytest pyinstaller

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Run Python tests
        working-directory: exporter-python
        run: pytest

      - name: Run desktop tests
        working-directory: apps/desktop
        run: npm test

      - name: Typecheck desktop
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Build desktop
        working-directory: apps/desktop
        run: npm run build

      - name: Build Python sidecar
        working-directory: apps/desktop
        run: npm run sidecar:build

      - name: Verify Python sidecar
        working-directory: apps/desktop
        run: npm run sidecar:verify

      - name: Package desktop app
        working-directory: apps/desktop
        run: npm run package

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.tar.gz
            apps/desktop/release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
