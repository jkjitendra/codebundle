name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Pin Python executable for sidecar scripts
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"CODEBUNDLE_PYTHON_PATH={sys.executable}\n")

          print(f"Using Python for CodeBundle sidecar scripts: {sys.executable}")
          PY

      - name: Install Linux package dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e exporter-python pytest pyinstaller

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Run Python tests
        working-directory: exporter-python
        run: pytest

      - name: Run desktop tests
        working-directory: apps/desktop
        run: npm test

      - name: Typecheck desktop
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Build desktop
        working-directory: apps/desktop
        run: npm run build

      - name: Build Python sidecar
        working-directory: apps/desktop
        run: npm run sidecar:build

      - name: Verify Python sidecar
        working-directory: apps/desktop
        run: npm run sidecar:verify

      - name: Configure optional release signing
        shell: bash
        env:
          REQUIRE_CODE_SIGNING: ${{ vars.REQUIRE_CODE_SIGNING || 'false' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          export REQUIRE_CODE_SIGNING="${REQUIRE_CODE_SIGNING:-false}"
          node scripts/release-signing.mjs --platform "$RUNNER_OS"

          case "$RUNNER_OS" in
            macOS)
              if [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" && -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
                {
                  echo "CSC_LINK=$CSC_LINK"
                  echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD"
                  echo "APPLE_ID=$APPLE_ID"
                  echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
                  echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
                  echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
                } >> "$GITHUB_ENV"
              else
                echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
              fi
              ;;
            Windows)
              if [[ -n "$WINDOWS_CSC_LINK" && -n "$WINDOWS_CSC_KEY_PASSWORD" ]]; then
                {
                  echo "CSC_LINK=$WINDOWS_CSC_LINK"
                  echo "CSC_KEY_PASSWORD=$WINDOWS_CSC_KEY_PASSWORD"
                  echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
                } >> "$GITHUB_ENV"
              else
                echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
              fi
              ;;
            *)
              echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Package desktop app
        working-directory: apps/desktop
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Packaging attempt ${attempt}/3"
            if npm run package:ci; then
              exit 0
            fi

            echo "Packaging attempt ${attempt} failed."

            if [ "$attempt" -lt 3 ]; then
              echo "Clearing Electron cache and retrying..."
              rm -rf "$HOME/.cache/electron" || true
              rm -rf "$HOME/Library/Caches/electron" || true
              if [ -n "${LOCALAPPDATA:-}" ]; then
                rm -rf "$LOCALAPPDATA/electron/Cache" || true
              fi
              sleep $((attempt * 20))
            fi
          done

          exit 1

      - name: Verify updater metadata
        working-directory: apps/desktop
        shell: bash
        run: node ../../scripts/verify-release-artifacts.mjs --platform "$RUNNER_OS" --release-dir release

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        shell: bash
        run: |
          if [[ -n "${CSC_LINK:-}" && -n "${CSC_KEY_PASSWORD:-}" && -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            bash ../../scripts/verify-macos-signing.sh release
          else
            echo "macOS signing credentials missing: unsigned beta artifact verification only."
          fi

      - name: Verify Windows signature
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          if ($env:CSC_LINK -and $env:CSC_KEY_PASSWORD) {
            & ../../scripts/verify-windows-signature.ps1 -ReleaseDirectory release -RequireSigned
          } else {
            & ../../scripts/verify-windows-signature.ps1 -ReleaseDirectory release
          }

      - name: List release files
        working-directory: apps/desktop
        shell: bash
        run: |
          echo "Release files:"
          find release -maxdepth 1 -type f -print | sort

      - name: Upload macOS release artifacts
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          overwrite_files: true
          files: apps/desktop/release/*Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows portable
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          overwrite_files: true
          files: apps/desktop/release/*Portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows update metadata
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            apps/desktop/release/latest.yml
            apps/desktop/release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux release artifacts
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.tar.gz
            apps/desktop/release/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
