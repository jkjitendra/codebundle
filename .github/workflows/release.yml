name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Pin Python executable for sidecar scripts
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"CODEBUNDLE_PYTHON_PATH={sys.executable}\n")

          print(f"Using Python for CodeBundle sidecar scripts: {sys.executable}")
          PY

      - name: Install Linux package dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e exporter-python pytest pyinstaller

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Run Python tests
        working-directory: exporter-python
        run: pytest

      - name: Run desktop tests
        working-directory: apps/desktop
        run: npm test

      - name: Typecheck desktop
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Build desktop
        working-directory: apps/desktop
        run: npm run build

      - name: Build Python sidecar
        working-directory: apps/desktop
        run: npm run sidecar:build

      - name: Verify Python sidecar
        working-directory: apps/desktop
        run: npm run sidecar:verify

      - name: Package desktop app
        working-directory: apps/desktop
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Packaging attempt ${attempt}/3"
            if npm run package:ci; then
              exit 0
            fi

            echo "Packaging attempt ${attempt} failed."

            if [ "$attempt" -lt 3 ]; then
              echo "Clearing Electron cache and retrying..."
              rm -rf "$HOME/.cache/electron" || true
              rm -rf "$HOME/Library/Caches/electron" || true
              if [ -n "${LOCALAPPDATA:-}" ]; then
                rm -rf "$LOCALAPPDATA/electron/Cache" || true
              fi
              sleep $((attempt * 20))
            fi
          done

          exit 1

      - name: Upload macOS release artifacts
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows release artifacts
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            apps/desktop/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux release artifacts
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}