[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebundle-exporter"
version = "0.1.0"
description = "Standalone Python CLI exporter for CodeBundle."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CodeBundle" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
codebundle-exporter = "codebundle_exporter.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
