appId: in.jkjitendra.codebundle
productName: CodeBundle
directories:
  output: release
artifactName: ${productName}-${version}-${arch}.${ext}
files:
  - out/**
  - package.json
extraResources:
  - from: ../../resources/sidecars/current/
    to: sidecars/
    filter:
      - codebundle-exporter*
mac:
  icon: build/icon.icns
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
nsis:
  artifactName: ${productName}-${version}-Windows-${arch}-Setup.${ext}
portable:
  artifactName: ${productName}-${version}-Windows-${arch}-Portable.${ext}
linux:
  icon: build/icons
  category: Development
  maintainer: "Jitendra <jkjitendra725@gmail.com>"
  vendor: jkjitendra
  target:
    - AppImage
    - deb
    - tar.gz
