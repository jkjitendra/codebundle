appId: in.jkjitendra.codebundle
productName: CodeBundle
publish:
  provider: github
  owner: jkjitendra
  repo: codebundle
directories:
  output: release
artifactName: ${productName}-${version}-${arch}.${ext}
files:
  - out/**
  - package.json
extraResources:
  - from: ../../resources/sidecars/current/
    to: sidecars/
    filter:
      - codebundle-exporter*
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true
  binaries:
    - Contents/Resources/sidecars/codebundle-exporter
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  signAndEditExecutable: true
  signtoolOptions:
    publisherName: "Jitendra"
  target:
    - nsis
    - portable
nsis:
  artifactName: ${productName}-${version}-Windows-${arch}-Setup.${ext}
portable:
  artifactName: ${productName}-${version}-Windows-${arch}-Portable.${ext}
linux:
  icon: build/icons
  category: Development
  maintainer: "Jitendra <jkjitendra725@gmail.com>"
  vendor: jkjitendra
  target:
    - AppImage
    - deb
    - tar.gz
